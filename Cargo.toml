[package]
name = "bigos"
version = "0.1.0"
edition = "2024"
authors = ["sioworker"]

[lib]
crate-type = ["cdylib"]

[dependencies]
wasm-bindgen = "=0.2.129"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
web-sys = { version = "0.3", features = ["Window", "Document", "Element", "HtmlElement", "Node", "NodeList", "Text", "TreeWalker", "DocumentFragment", "DomTokenList", "MediaQueryList", "KeyboardEvent", "EventTarget", "Location"] }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
